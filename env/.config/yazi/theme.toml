[app]
overall = { bg = "#161616" }

[mgr]
cwd = { fg = "#dce5e5" }

hovered = { bg = "#252525" }
preview_hovered = { bg = "#252525" }

find_keyword = { fg = "#161616", bg = "#e4c56b", bold = false }
find_position = { fg = "#dce5e5", bg = "#252525", bold = false }

marker_copied = { fg = "#5fc878", bg = "#5fc878" }
marker_cut = { fg = "#e66b80", bg = "#e66b80" }
marker_marked = { fg = "#b895de", bg = "#b895de" }
marker_selected = { fg = "#dce5e5", bg = "#303030" }

border_symbol = "│"
border_style = { fg = "#2a2a2a" }

[tabs]
active = { fg = "#dce5e5", bg = "#303030", bold = false }
inactive = { fg = "#626262", bg = "#1b1b1b" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#dce5e5", bg = "#252525", bold = false }
normal_alt = { fg = "#626262", bg = "#1b1b1b" }

select_main = { fg = "#dce5e5", bg = "#303030", bold = false }
select_alt = { fg = "#626262", bg = "#1b1b1b" }

unset_main = { fg = "#e66b80", bg = "#1b1b1b", bold = false }
unset_alt = { fg = "#626262", bg = "#1b1b1b" }

[indicator]
parent = { fg = "#4a4a4a" }
current = { bg = "#303030", bold = false }
preview = { fg = "#4a4a4a" }
padding = { open = " ", close = " " }

[status]
overall = { fg = "#626262", bg = "#1b1b1b" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label = { fg = "#dce5e5", bold = false }
progress_normal = { fg = "#dce5e5", bg = "#252525" }
progress_error = { fg = "#e66b80", bg = "#252525" }

perm_sep = { fg = "#2a2a2a" }
perm_type = { fg = "#5aa6e6" }
perm_read = { fg = "#e4c56b" }
perm_write = { fg = "#e66b80" }
perm_exec = { fg = "#5fc878" }

[which]
cols = 3
mask = { bg = "#161616" }
cand = { fg = "#dce5e5" }
rest = { fg = "#626262" }
desc = { fg = "#4a4a4a" }
separator = "  "
separator_style = { fg = "#2a2a2a" }

[confirm]
border = { fg = "#2a2a2a" }
title = { fg = "#dce5e5" }
btn_yes = { fg = "#161616", bg = "#dce5e5", bold = false }
btn_no = { fg = "#626262", bg = "#252525" }
btn_labels = [ "  Yes  ", "  No  " ]

[spot]
border = { fg = "#2a2a2a" }

[notify]
title_info = { fg = "#dce5e5" }
title_warn = { fg = "#e4c56b" }
title_error = { fg = "#e66b80" }
icon_info = ""
icon_warn = ""
icon_error = ""

[pick]
border = { fg = "#2a2a2a" }
active = { fg = "#dce5e5", bg = "#303030" }
inactive = { fg = "#626262" }

[input]
border = { fg = "#2a2a2a" }
title = { fg = "#dce5e5" }
value = { fg = "#dce5e5" }
selected = { bg = "#303030" }

[cmp]
border = { fg = "#2a2a2a" }
active = { fg = "#dce5e5", bg = "#303030" }
inactive = { fg = "#626262" }

[tasks]
border = { fg = "#2a2a2a" }
hovered = { bg = "#252525" }

[help]
on = { fg = "#dce5e5" }
run = { fg = "#626262" }
desc = { fg = "#4a4a4a" }
hovered = { bg = "#252525" }
footer = { fg = "#4a4a4a", bg = "#161616" }

[filetype]
rules = [
    { url = "*/", fg = "#e5ecec", bold = false },
    { url = "*", fg = "#dce5e5" }
]

